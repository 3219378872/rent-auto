version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gosec
  settings:
    gosec:
      # 规则级豁免均经人工审计（round5-7），理由随行：
      excludes:
        - G404 # math/rand：仅非密钥标识符（UU 设备ID/会话关联ID），上游兼容
        - G115 # 整型边界转换：全部位于平台线协议编解码（SteamID/protobuf 长度守卫/pad），边界已验证
        - G401 # sha1：Steam Guard 协议强制摘要算法
        - G505 # sha1 导入：同上
        # 注：G117/G704/G124 属新版 gosec 规则 ID，golangci v2.6 打包版本不识别，
        # 无法进规则级豁免（config verify 拒绝）——相关位点用定向 //nolint 并注明理由
    revive:
      rules:
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
