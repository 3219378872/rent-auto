name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rentauto
          POSTGRES_PASSWORD: rentauto
          POSTGRES_DB: rentauto_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U rentauto"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: fmt check
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend
          version: v2.6
          install-mode: goinstall
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test ./... -race -count=1
      - name: integration tests
        env:
          TEST_DATABASE_URL: postgres://rentauto:rentauto@localhost:15432/rentauto_test?sslmode=disable
        run: go test -tags=integration ./... -count=1
      - name: vulnerability scan (soft gate)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
      - name: pure-package coverage gate (>=70%)
        env:
          TEST_DATABASE_URL: postgres://rentauto:rentauto@localhost:15432/rentauto_test?sslmode=disable
        run: |
          go test -tags=integration ./... -count=1 -coverprofile=coverage.out -coverpkg=./internal/...
          ../scripts/coverage-gate.sh . 70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm exec vitest run
      - run: pnpm exec vite build
