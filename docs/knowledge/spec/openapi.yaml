openapi: "3.0.3"
info:
  title: rent-auto API
  version: "0.8.0"
  description: |
    UU/ECO 双渠道 Steam 饰品租赁自动化系统 API。
    约定：
    - 前缀 /api/v1；除 health/login 外全部需要 Bearer JWT
    - 分页：query page(1-based) & page_size(<=200，round10 统一口径)；响应 {items,total}
    - 错误体：{code,message}；金额两位小数
    - 401 body code 恒为 `unauthorized`：前端据此清 token 回登录页
      （含登出吊销后的旧 token —— 会话纪元机制见 ADR-0006）
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 健康检查（公开）
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
  /auth/login:
    post:
      summary: 登录获取 JWT（公开）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: token（绑定当前会话纪元）
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Err401" }
        "429": { $ref: "#/components/responses/Err429" }
  /auth/me:
    get:
      summary: 当前会话信息
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
  /auth/logout:
    post:
      summary: 登出并吊销全部既有 token（会话纪元 +1，ADR-0006）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /inventory:
    get:
      summary: 库存列表（分页）
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [uu, eco] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: 关键字（市场名模糊匹配） }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页库存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/InventoryItem" }
  /listings:
    get:
      summary: 上架列表（分页）
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [uu, eco] } }
        - { name: state, in: query, schema: { type: string }, description: 实际状态过滤 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页上架
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ListingRow" }
  /orders:
    get:
      summary: 租赁订单（分页）
      parameters:
        - { name: channel, in: query, schema: { type: string, enum: [uu, eco] } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/OrderRow" }
  /templates:
    get:
      summary: 模板清单（含锚点/黑名单标记）
      description: >-
        分页可选：不带 page/page_size 时返回全量目录（面板黑名单表与模板选择器
        依赖完整清单）；带 page_size 时按 1-based page 切页（上限 200）。
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 0, maximum: 200 },
            description: "≤0 或缺省 = 全量" }
      responses:
        "200":
          description: 模板数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
  /templates/blacklist:
    put:
      summary: 切换模板拉黑状态（退出路由与锚点合成；审计 template.blacklist）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash_name]
              properties:
                hash_name: { type: string }
                blacklisted: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Err400" }
  /inventory/{channel}/{asset_id}/cost:
    put:
      summary: 录入/修正成本价
      parameters:
        - { name: channel, in: path, required: true, schema: { type: string, enum: [uu, eco] } }
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cost]
              properties:
                cost: { type: number, format: double, minimum: 0 }
      responses:
        "200":
          description: 回显成本
          content:
            application/json:
              schema:
                type: object
                properties:
                  cost: { type: number, format: double }
        "400": { $ref: "#/components/responses/Err400" }
  /strategies:
    get:
      summary: 策略行列表（global+template，只读）
      responses:
        "200":
          description: 策略数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StrategyView" }
  /strategies/template:
    post:
      summary: 创建/替换模板级覆盖策略（每模板一行；新建行默认 dry-run）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash_name, channel_route]
              properties:
                hash_name: { type: string }
                channel_route: { type: string, enum: [uu_only, eco_only, both, uu_primary_eco_fallback] }
                params:
                  type: object
                  description: 分组结构（baseline/factor/guardrails/uu_max_days/eco_max_days），深覆盖全局
                real_execution_enabled: { type: boolean, description: 更新时缺省=保留原值 }
                priority: { type: integer }
      responses:
        "200":
          description: 行 id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Err400" }
  /strategies/template/{id}:
    delete:
      summary: 删除模板级覆盖（立即回落全局策略）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { $ref: "#/components/responses/Err400" }
  /strategies/global:
    put:
      summary: 更新全局策略（参数/路由/真实执行开关，单事务生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { type: object, description: 策略参数 JSON（深合并默认值） }
                route: { type: string, enum: [uu_only, eco_only, both, uu_primary_eco_fallback],
                  description: 路由（别名；与 channel_route 二选一，channel_route 优先） }
                channel_route: { type: string, enum: [uu_only, eco_only, both, uu_primary_eco_fallback],
                  description: 路由（面板 canonical 字段；与 route 双收） }
                real_execution_enabled: { type: boolean, description: false=策略级 dry-run }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/Err400" }
  /audit:
    get:
      summary: 审计日志（最近 N 条）
      parameters:
        - { name: action, in: query, schema: { type: string }, description: 动作关键字过滤 }
        - { name: channel, in: query, schema: { type: string, enum: [uu, eco] } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Page"
        - { name: page_size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 分页审计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }
  /dashboard:
    get:
      summary: 仪表盘聚合（资产/收益/年化/曲线）
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /jobs:
    get:
      summary: 任务状态列表
      responses:
        "200":
          description: 任务数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobStatus" }
  /jobs/{name}/run:
    post:
      summary: 手动触发一次任务（立即执行，10 分钟预算，停机前会被等待）
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已触发
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: 任务未知或正在运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /channels:
    get:
      summary: 渠道健康状态
      responses:
        "200":
          description: "渠道 → 状态（ok / not_configured / error:…；含 steam）"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
  /channels/uu/sms:
    post:
      summary: 发起 UU 短信登录（三种模式：下行验证码 / 上行短信指引 / 图形验证码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                session_id: { type: string, description: 重试时回传上次返回值 }
                captcha:
                  type: object
                  description: captcha 模式重试时携带 TCaptcha 结果；必须同时回传首次响应的 session_id（票据链与 session 绑定），否则 400
                  properties:
                    ticket: { type: string }
                    randstr: { type: string }
                    req_ticket: { type: string }
      responses:
        "200":
          description: 发送结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UUSmsResponse" }
        "400": { $ref: "#/components/responses/Err400" }
        "502": { $ref: "#/components/responses/Err502" }
  /channels/uu/sms-verify:
    post:
      summary: 提交短信验证码完成登录并保存凭证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, phone, code]
              properties:
                session_id: { type: string }
                phone: { type: string }
                code: { type: string }
                login_req_ticket: { type: string, description: 下行模式成功响应携带的关联票据 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: 验证码错误等上游拒绝（非面板会话失效）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /channels/uu:
    put:
      summary: 手动导入 UU Token（5050 登录门禁的替代路径）
      description: |
        平台限制第三方客户端短信登录（code=5050）后，管理员在官网/APP 登录
        获取 JWT token，粘贴导入。服务端先以 getUserInfo 验证 token 有效性，
        验证通过后 AES-256-GCM 加密落库并即时重建 UU 适配器。审计仅记
        token 尾 8 位指纹。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: UU JWT（三段式）}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: token 为空或上游校验失败（84101 失效/网络错误）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /channels/eco:
    put:
      summary: 保存 ECO 凭证（加密落库并即时重建适配器）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id, private_key_pem]
              properties:
                partner_id: { type: string }
                private_key_pem: { type: string, description: PKCS8 PEM }
                steam_id: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/Err400" }
  /channels/steam:
    put:
      summary: 保存 Steam 凭证（触发真实登录与会话持久化）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, shared_secret, identity_secret]
              properties:
                username: { type: string }
                password: { type: string }
                shared_secret: { type: string }
                identity_secret: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/Err400" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
  responses:
    Err400:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Err401:
      description: 未认证/已吊销
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Err429:
      description: 登录尝试过多（固定窗口锁定）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Err502:
      description: 上游平台失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    PagedEnvelope:
      type: object
      properties:
        total: { type: integer }
    Channel:
      type: string
      enum: [uu, eco]
    InventoryItem:
      type: object
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        asset_id: { type: string }
        hash_name: { type: string }
        display_name: { type: string }
        template_id: { type: integer, format: int64 }
        mark_price: { type: number, format: double }
        tradable: { type: boolean }
        status: { type: string, enum: [in_stock, listed, leased, locked, sold] }
        abrade: { type: number, format: double }
        cost_basis: { type: number, format: double, description: 成本价（PUT /inventory/{channel}/{asset_id}/cost 录入） }
    ListingRow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        channel: { $ref: "#/components/schemas/Channel" }
        asset_id: { type: string }
        hash_name: { type: string }
        goods_ref: { type: string }
        desired_state: { type: string, enum: [none, active, delisted] }
        actual_state: { type: string, enum: [unknown, none, active, leased, stale] }
        rent_price: { type: number, format: double }
        long_rent_price: { type: number, format: double, nullable: true }
        max_days: { type: integer, nullable: true }
        deposit: { type: number, format: double, nullable: true }
        listed_at: { type: string, format: date-time, nullable: true }
        last_reprice_at: { type: string, format: date-time, nullable: true }
        factor: { type: number, format: double, description: 反馈控制器乘子（基线×factor=执行价） }
        last_decision:
          type: object
          nullable: true
          description: 最新 price_action 摘要（面板决策依据列）
          properties:
            action: { type: string, enum: [publish, reprice, delist, skip] }
            at: { type: string, format: date-time, nullable: true }
            new_rent: { type: number, format: double, nullable: true }
            skip: { type: string, description: skip 原因（decision jsonb） }
    OrderRow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        channel: { $ref: "#/components/schemas/Channel" }
        order_ref: { type: string }
        hash_name: { type: string }
        order_type: { type: string, enum: [short, long, buyout] }
        status: { type: string }
        rent_days: { type: integer }
        rent_price: { type: number, format: double }
        order_amount: { type: number, format: double }
        deposits: { type: number, format: double }
        started_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Template:
      type: object
      properties:
        hash_name: { type: string }
        display_name: { type: string }
        category: { type: string }
        uu_template_id: { type: integer, format: int64, nullable: true }
        uu_mark_price: { type: number, format: double, nullable: true }
        eco_ref_price: { type: number, format: double, nullable: true }
        value_anchor: { type: number, format: double, nullable: true }
        blacklisted: { type: boolean }
        anchor_updated_at: { type: string, format: date-time, nullable: true }
    StrategyView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scope: { type: string, enum: [global, template] }
        channel_route: { type: string, enum: [uu_only, eco_only, both, uu_primary_eco_fallback] }
        params: { type: object }
        real_execution_enabled: { type: boolean }
        priority: { type: integer }
        updated_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        actor: { type: string, description: "system | user:<name>" }
        action: { type: string }
        channel: { type: string }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
    Dashboard:
      type: object
      properties:
        assets:
          type: object
          properties:
            total: { type: number, format: double }
            inventory: { type: number, format: double }
            deposits:
              type: object
              additionalProperties: { type: number, format: double }
            wallets:
              type: object
              additionalProperties: { type: number, format: double }
        income:
          type: object
          properties:
            total: { type: number, format: double }
            today: { type: number, format: double }
            by_channel:
              type: array
              items:
                type: object
                properties:
                  channel: { $ref: "#/components/schemas/Channel" }
                  income: { type: number, format: double }
                  orders: { type: integer }
        leased_out: { type: integer }
        annualized_roi: { type: number, format: double }
        categories:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              cost: { type: number, format: double, description: 全量成本基（口径 B 分母） }
              income: { type: number, format: double }
              yield: { type: number, format: double }
        series_30d:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date, description: UTC 日（canonical；day 为同义别名） }
              day: { type: string, format: date, description: date 的同义别名 }
              income: { type: number, format: double }
    JobStatus:
      type: object
      properties:
        name: { type: string }
        next_run: { type: string, format: date-time }
        last_run: { type: string, format: date-time, nullable: true }
        last_ok: { type: boolean }
        last_error: { type: string }
        running: { type: boolean }
    UUSmsResponse:
      type: object
      properties:
        session_id: { type: string }
        mode:
          type: string
          enum: [down, up, captcha]
          description: down=收验证码（login_req_ticket 随附）；up=用户自发短信；captcha=需人工过图形验证（req_ticket 随附）
        msg: { type: string }
        req_ticket: { type: string, description: captcha 模式的关联票据 }
        login_req_ticket: { type: string, description: down 模式成功响应的关联票据（sms-verify 回传） }
        secs: { type: integer, description: 冷却秒数（0=未知） }
        sms_up_content: { type: string, description: 上行模式短信内容 }
        sms_up_number: { type: string, description: 上行模式目标号码 }
