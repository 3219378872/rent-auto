name: rent-auto

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rentauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentauto}
      POSTGRES_DB: rentauto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentauto"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://rentauto:${POSTGRES_PASSWORD:-rentauto}@postgres:5432/rentauto?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env 中设置 32 字节以上随机串}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      DRY_RUN_DEFAULT: ${DRY_RUN_DEFAULT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
