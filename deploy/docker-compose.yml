services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rentauto
      POSTGRES_PASSWORD: rentauto
      POSTGRES_DB: rentauto
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentauto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
