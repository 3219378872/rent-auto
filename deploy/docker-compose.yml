name: rent-auto

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rentauto
      # 弱默认密码仅可接受于下方端口只绑回环的前提下；
      # 任何对外/跨机部署必须在 deploy/.env 覆盖为强密码（≥20 位随机串，
      # 与其它密码不复用；泄露后立即轮换并检查 pgdata 备份）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentauto}
      POSTGRES_DB: rentauto
    ports:
      # 只绑定宿主机回环地址——数据库绝不能暴露到非本机网络（security-spec）。
      - "127.0.0.1:${PG_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentauto"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://rentauto:${POSTGRES_PASSWORD:-rentauto}@postgres:5432/rentauto?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?在 deploy/.env 中设置 32 字节以上随机串}
      # APP_MASTER_KEY 为空允许启动，但三渠道（UU/ECO/Steam）凭证不可读写：
      # 凭证写入接口统一返回 500“APP_MASTER_KEY未配置，三渠道不可用”。
      # 生产/真机必须在 deploy/.env 设置 32 字节 hex（openssl rand -hex 32），
      # 一经写入凭证绝不轮换（轮换=历史凭证全部无法解密）。
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      DRY_RUN_DEFAULT: ${DRY_RUN_DEFAULT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_BOOTSTRAP_FILE: /var/lib/rent-auto/admin-password
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - backend_data:/var/lib/rent-auto
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: rentauto
      PGDATABASE: rentauto
      PGPASSWORD: ${POSTGRES_PASSWORD:-rentauto}
      PGCONNECT_TIMEOUT: "10"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
    volumes:
      - pgbackups:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups/rent-auto -maxdepth 1 -type f -name 'rent-auto-*.dump' -mmin -2160 -print -quit | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 5m
    restart: unless-stopped

volumes:
  pgdata:
  backend_data:
  caddy_data:
  caddy_config:
  pgbackups:
